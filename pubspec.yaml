name: kaeset_message_system
description: KAESET MESSAGE SYSTEM - Android M-Pesa SMS Reader and Customer Transaction Search App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite local database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # State management & Preferences
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.0
  csv: ^6.0.0

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build KAESET Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Environment
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split APKs (arm64, armeabi, x86_64)
        run: flutter build apk --split-per-abi

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v3
        with:
          name: kaeset-app-release-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split Release APKs
        uses: actions/upload-artifact@v3
        with:
          name: kaeset-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
